name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to a release for this version's tag or existing draft
        type: boolean
        default: false
      artifacts_run:
        description: Reuse tested installers from this workflow run ID
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    if: inputs.artifacts_run == ''
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: win, arch: x64 }
          - { runner: ubuntu-22.04, platform: linux, arch: x64 }
          - { runner: ubuntu-22.04-arm, platform: linux, arch: arm64 }
          - { runner: macos-26-intel, platform: mac, arch: x64 }
          - { runner: macos-15, platform: mac, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and Electron
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js
      - name: Check version matches release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Verify combat and map logic
        run: npm test
      - name: Prepare verified media tools
        run: npm run tools
      - name: Verify Windows desktop interaction and persistence
        if: runner.os == 'Windows'
        run: node tests/desktop-smoke.cjs
      - name: Verify Windows map and story boards
        if: runner.os == 'Windows'
        run: |
          node tests/map-window-smoke.cjs
          node tests/scene-smoke.cjs
          node tests/story-smoke.cjs
          node tests/welcome-smoke.cjs
          node tests/session-smoke.cjs
          node tests/workspace-smoke.cjs
          node tests/workspace-600-smoke.cjs
          node tests/browser-zoom-smoke.cjs
          node tests/campaign-tools-smoke.cjs
      - name: Install native Debian packager
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        shell: bash
        run: |
          sudo gem install fpm --version 1.17.0 --no-document
          command -v fpm
          echo 'USE_SYSTEM_FPM=true' >> "$GITHUB_ENV"
      - name: Build installers
        shell: bash
        run: |
          for attempt in 1 2; do
            if npm run build -- --${{ matrix.platform }} --${{ matrix.arch }}; then exit 0; fi
            if [[ "$attempt" == 2 ]]; then exit 1; fi
            sleep 5
          done
      - name: Verify packaged Windows sound, dice and map transitions
        if: runner.os == 'Windows'
        run: |
          $env:DM_SCREEN_EXECUTABLE = (Resolve-Path -LiteralPath 'dist/win-unpacked/Адвентурикон.exe').Path
          node tests/sound-update-smoke.cjs
          node tests/dice-portals-smoke.cjs
          node tests/battle-map-smoke.cjs
      - name: Verify packaged Linux desktop
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth openbox
          export DM_SCREEN_EXECUTABLE="$(find "$PWD/dist" -maxdepth 2 -name dm-screen -type f -print -quit)"
          test -x "$DM_SCREEN_EXECUTABLE"
          xvfb-run -a -s '-screen 0 1600x1000x24' bash -e -c '
            openbox >/tmp/dm-screen-openbox.log 2>&1 &
            node tests/welcome-smoke.cjs
            node tests/map-window-smoke.cjs
            node tests/browser-zoom-smoke.cjs
            node tests/campaign-tools-smoke.cjs
          '
      - name: Verify packaged macOS desktop
        if: runner.os == 'macOS'
        shell: bash
        env:
          DEBUG: pw:browser
          DM_SCREEN_TEST_NO_NATIVE_FULLSCREEN: ${{ matrix.arch == 'x64' && '1' || '0' }}
        run: |
          app="$(find "$PWD/dist" -maxdepth 2 -type d -name '*.app' -print -quit)"
          codesign --verify --deep --strict "$app"
          export DM_SCREEN_EXECUTABLE="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")"
          test -x "$DM_SCREEN_EXECUTABLE"
          node tests/welcome-smoke.cjs
          node tests/map-window-smoke.cjs
          node tests/story-smoke.cjs
          node tests/browser-zoom-smoke.cjs
          node tests/campaign-tools-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            !dist/builder-*.yml

  publish:
    if: >-
      !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
      && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.artifacts_run != ''))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Identify the commit used to build the installers
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_RUN: ${{ inputs.artifacts_run }}
        shell: bash
        run: |
          target="$GITHUB_SHA"
          if [[ -n "$ARTIFACTS_RUN" ]]; then
            [[ "$ARTIFACTS_RUN" =~ ^[0-9]+$ ]]
            workflow="$(gh run view "$ARTIFACTS_RUN" --json workflowName --jq .workflowName)"
            test "$workflow" = 'Desktop release'
            passed="$(gh run view "$ARTIFACTS_RUN" --json jobs --jq '[.jobs[] | select(.name != "publish" and .conclusion == "success")] | length')"
            test "$passed" = 5
            target="$(gh run view "$ARTIFACTS_RUN" --json headSha --jq .headSha)"
          fi
          echo "commit=$target" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ inputs.artifacts_run && github.token || '' }}
          run-id: ${{ inputs.artifacts_run || github.run_id }}
      - name: Publish matching installers and update manifests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          cd release-assets
          installers=(
            "Adventuricon-Setup-$version.exe"
            "Adventuricon-$version-linux-x86_64.AppImage"
            "Adventuricon-$version-linux-arm64.AppImage"
            "Adventuricon-$version-linux-amd64.deb"
            "Adventuricon-$version-linux-arm64.deb"
            "Adventuricon-$version-mac-x64.dmg"
            "Adventuricon-$version-mac-arm64.dmg"
          )
          updates=("Adventuricon-Setup-$version.exe.blockmap" latest.yml latest-linux.yml latest-linux-arm64.yml)
          for file in "${installers[@]}" "${updates[@]}"; do
            if [[ ! -s "$file" ]]; then
              ls -1
              echo "Missing release asset: $file" >&2
              exit 1
            fi
          done
          sha256sum "${installers[@]}" > SHA256SUMS
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$draft" == false ]]; then
            echo "$tag is already published"
            exit 0
          fi
          if [[ "$draft" == true ]]; then
            target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
            test "$target" = "$RELEASE_COMMIT"
          else
            gh release create "$tag" --verify-tag --draft --target "$RELEASE_COMMIT" \
              --title "Адвентурикон $version" --generate-notes
          fi
          gh release upload "$tag" "${installers[@]}" "${updates[@]}" SHA256SUMS
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent; then
            if [[ "$version" == *-* ]]; then
              gh release edit "$tag" --draft=false --prerelease --latest=false
            else
              gh release edit "$tag" --draft=false --latest
            fi
          else
            echo "Draft assets uploaded. Publish $tag from a GitHub account that can create the tag."
          fi
