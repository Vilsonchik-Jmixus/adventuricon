name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release if all builds pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: win, arch: x64 }
          - { runner: ubuntu-22.04, platform: linux, arch: x64 }
          - { runner: ubuntu-22.04-arm, platform: linux, arch: arm64 }
          - { runner: macos-26-intel, platform: mac, arch: x64 }
          - { runner: macos-26, platform: mac, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and Electron
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js
      - name: Check version matches release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Verify combat and map logic
        run: npm test
      - name: Prepare verified media tools
        run: npm run tools
      - name: Verify Windows desktop interaction and persistence
        if: runner.os == 'Windows'
        run: |
          node tests/desktop-smoke.cjs
          node tests/map-window-smoke.cjs
          node tests/welcome-smoke.cjs
      - name: Build installers
        run: npm run build -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Verify packaged Linux desktop
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth openbox
          export DM_SCREEN_EXECUTABLE="$(find "$PWD/dist" -maxdepth 2 -name dm-screen -type f -print -quit)"
          test -x "$DM_SCREEN_EXECUTABLE"
          xvfb-run -a -s '-screen 0 1600x1000x24' bash -e -c '
            openbox >/tmp/dm-screen-openbox.log 2>&1 &
            node tests/welcome-smoke.cjs
            node tests/map-window-smoke.cjs
          '
      - name: Verify packaged macOS desktop
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$(find "$PWD/dist" -maxdepth 2 -type d -name '*.app' -print -quit)"
          codesign --verify --deep --strict "$app"
          export DM_SCREEN_EXECUTABLE="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")"
          test -x "$DM_SCREEN_EXECUTABLE"
          node tests/welcome-smoke.cjs
          node tests/map-window-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            !dist/builder-*.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish matching installers and update manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          cd release-assets
          installers=(
            "DM-Screen-Setup-$version.exe"
            "DM-Screen-$version-linux-x64.AppImage"
            "DM-Screen-$version-linux-arm64.AppImage"
            "DM-Screen-$version-linux-x64.deb"
            "DM-Screen-$version-linux-arm64.deb"
            "DM-Screen-$version-mac-x64.dmg"
            "DM-Screen-$version-mac-arm64.dmg"
          )
          updates=("DM-Screen-Setup-$version.exe.blockmap" latest.yml latest-linux.yml latest-linux-arm64.yml)
          for file in "${installers[@]}" "${updates[@]}"; do test -s "$file"; done
          sha256sum "${installers[@]}" > SHA256SUMS
          gh release create "$tag" "${installers[@]}" "${updates[@]}" SHA256SUMS \
            --draft --target "$GITHUB_SHA" --title "Интерактивная ширма мастера $version" --generate-notes
          gh release edit "$tag" --draft=false --latest
