name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download Electron
        run: node node_modules/electron/install.js
      - name: Check version matches release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - name: Verify combat and map logic
        run: npm test
      - name: Download verified media importer and MP3 converter
        run: npm run tools
      - name: Verify desktop interaction and persistence
        run: node tests/desktop-smoke.cjs
      - name: Verify map scaling and combat queue
        run: node tests/map-window-smoke.cjs
      - name: Build and publish installer and update manifest
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
